
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Orion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card mx-auto shadow" id="cardSistema">
            <img
                src="https://placehold.co/600x300/253858/ffffff?text=SISTEMA+ORION"
                class="card-img-top"
                alt="Imagem do Sistema Orion" >
            <div class="card-body text-center p-4">
                <h4 class="card-title" id="titulo">
                    Sistema Orion
                </h4>
                <span class="badge bg-secondary mb-3" id="status">
                    OFFLINE
                </span>
                <p class="card-text" id="mensagem">
                    Sistema desativado. Clique no botão para iniciar.
                </p>
                <button class="btn btn-primary w-100" id="botao">
                    Ativar Sistema
                </button>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
